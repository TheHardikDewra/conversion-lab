<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conversion Lab - landing page teardowns that score</title>
    <meta
      name="description"
      content="Paste a landing page URL. Get a scored CRO teardown across six categories, ranked issues with fixes, and stronger copy you can ship."
    />
    <meta name="theme-color" content="#0a0a09" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem("cl-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var dark = saved ? saved === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
